image: mingc/android-build-box:latest

stages:
  - build

build_and_deploy:
  stage: build
  script:
    - npm install
    - npm run build
    
    # إنشاء ملف الإصدار
    - echo "{\"version\": \"$CI_PIPELINE_IID\"}" > dist/version.json
    
    # تجهيز ملفات الموقع لـ GitLab Pages
    - rm -rf public
    - mv dist public
    
    # إعداد Capacitor وبناء الـ APK
    - npm install @capacitor/core @capacitor/cli @capacitor/android
    - npx cap add android
    - npx cap sync
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug --no-daemon
    
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - public
    expire_in: 1 week