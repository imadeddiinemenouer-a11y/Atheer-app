name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Capacitor dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Add Android platform and sync assets
      run: |
        npx cap add android
        npx cap sync android

    # ✅ هذا هو الحل: تعديل ملف build.gradle لإجبار استخدام إصدار Kotlin واحد
    - name: Fix Kotlin stdlib conflicts
      run: |
        cd android
        echo "" >> build.gradle
        echo "allprojects {" >> build.gradle
        echo "    configurations.all {" >> build.gradle
        echo "        resolutionStrategy {" >> build.gradle
        echo "            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> build.gradle
        echo "            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> build.gradle
        echo "        }" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: atheer-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk