 await P('doc',id,DM[id]);svIx();svG();xp(Math.min(20,ids.length));

function rank(q,k){const t=terms(q),sc={},N=IX.N||1,avg=IX.len/N||1;

 return Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,k||4)}

 for(const [cid] of r){const row=await G('chunk',cid);if(!row)continue;const d=DM[row.d];if(d){d.used=Date.now();P('doc',d.id,d)}
  out.push({txt:await ungz(row.z),name:d?d.name:'؟'})}
 const qt=terms(q),cov=out.length&&qt.length?qt.filter(w=>terms(out[0].txt).includes(w)).length/qt.length:0;
 return {cs:out,top:r.length?r[0][1]:0,cov}}
/* ---------- شبكة المفاهيم ---------- */
function link(top){for(let i=0;i<top.length;i++){Gr.n[top[i]]=(Gr.n[top[i]]||0)+1;
 for(let j=i+1;j<top.length;j++){const k=[top[i],top[j]].sort().join('|');Gr.e[k]=(Gr.e[k]||0)+1}}
 const ks=Object.keys(Gr.e);if(ks.length>6000){const ne={};ks.sort((a,b)=>Gr.e[b]-Gr.e[a]).slice(0,5000).forEach(k=>ne[k]=Gr.e[k]);Gr.e=ne}}

/* ---------- الذاكرة: تقوية / نسيان / تحقق ---------- */

function clsTrain(label,text){const ws=tk(text);if(!ws.length||!label)return;
 const L=S.cls.labels[label]=S.cls.labels[label]||{n:0,words:{}};L.n++;S.cls.trained++;
 ws.forEach(w=>{L.words[w]=(L.words[w]||0)+1;S.cls.vocab[w]=(S.cls.vocab[w]||0)+1});sv('cls')}
function clsPredict(text){const ws=tk(text),labels=Object.keys(S.cls.labels);
 if(!labels.length||!ws.length)return null;const V=Object.keys(S.cls.vocab).length+1;
 let best=null,bp=0;labels.forEach(l=>{const L=S.cls.labels[l];
  let p=(L.n+1)/(S.cls.trained+labels.length);
  ws.forEach(w=>{p*=((L.words[w]||0)+1)/(L.n+V)});
  p=Math.log(p);if(p>bp){bp=p;best=l}});
 return best?{intent:best,logp:bp}:null}

function paintModel(m){const el=$('#mst');if(el)el.innerHTML=m||(LM.ready?'<span class="badge g">✔ النموذج يعمل محلياً</span> <b>'+esc(LM.name)+'</b>':'<span class="badge y">لا نموذج — الوضع الرمزي فعال</span>')}
/* ---------- DOCX حقيقي (ZIP deflate) ---------- */
async function docx(buf){const v=new DataView(buf),u=new Uint8Array(buf);let e=buf.byteLength-22;
 while(e>0&&v.getUint32(e,true)!==0x06054b50)e--;
 if(e<=0)throw new Error('ليست ملف docx صالح');
 let n=v.getUint16(e+10,true),p=v.getUint32(e+16,true);
 for(;n--;){const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
  if(new TextDecoder().decode(u.subarray(p+46,p+46+nl))==='word/document.xml'){
   const st=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),d=u.subarray(st,st+cs);
   const x=m===0?new TextDecoder().decode(d):await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return x.replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')}
  p+=46+nl+xl+cl}
 throw new Error('لم أجد المحتوى النصي')}
/* ---------- بصمة GGUF الصادقة (رأس فقط) ---------- */
async function ggufFingerprint(file){const buf=await file.slice(0,Math.min(file.size,4*1048576)).arrayBuffer();
 const v=new DataView(buf);const magic=v.getUint32(0,true);if(magic!==0x46554747)throw new Error('ليست GGUF (البايتات السحرية غير مطابقة)');
 const ver=v.getUint32(4,true),nt=v.getBigUint64(8,true),nk=Number(v.getBigUint64(16,true));
 let pos=24;const meta={};const gstr=()=>{const len=Number(v.getBigUint64(pos,true));pos+=8;
  const s=new TextDecoder().decode(new Uint8Array(buf,pos,Math.min(len,4096)));pos+=len;return s};
 const gval=t=>{switch(t){case 0:return v.getUint8(pos++);case 1:const i8=v.getInt8(pos);pos+=1;return i8;
  case 2:const u16=v.getUint16(pos,true);pos+=2;return u16;case 3:const i16=v.getInt16(pos,true);pos+=2;return i16;
  case 4:const u32=v.getUint32(pos,true);pos+=4;return u32;case 5:const i32=v.getInt32(pos,true);pos+=4;return i32;
  case 6:const f32=v.getFloat32(pos,true);pos+=4;return f32;case 7:return v.getBool?v.getBool(pos):!!v.getUint8(pos);case 7:pos+=1;return null;
  case 8:return gstr();case 9:const el=v.getUint32(pos,true);pos+=4;const n2=Number(v.getBigUint64(pos,true));pos+=8;pos+=n2*elsize(el);return '[ثابت]';
  case 10:const et=v.getUint32(pos,true);pos+=4;const n3=Number(v.getBigUint64(pos,true));pos+=8;pos+=n3*(1+elsize(et));return '[مصفوفة]';
  case 11:const gt=v.getUint32(pos,true);pos+=4;const kt=v.getUint32(pos,true);pos+=4;const vt=v.getUint32(pos,true);pos+=4;
   const nm=Number(v.getBigUint64(pos,true));pos+=8;for(let i=0;i<nm;i++){gstr();gval(vt)}return '[خريطة]';
  case 12:const bt=v.getUint32(pos,true);pos+=4;return gval(bt);default:throw new Error('نوع غير معروف '+t)}};
 const elsize=t=>[1,1,2,2,4,4,4,1,0,0,0,0][t]||0;
 for(let i=0;i<nk&&pos<buf.byteLength-32;i++){try{const k=gstr(),t=v.getUint32(pos,true);pos+=4;const val=gval(t);if(val!=null&&k.length<120)meta[k]=val}catch(e){break}}
 let est=0;try{for(let i=0;i<Math.min(Number(nt),400)&&pos<buf.byteLength-64;i++){gstr();const nd=v.getUint32(pos,true);pos+=4;
  let elems=1;for(let j=0;j<nd&&pos<buf.byteLength-8;j++){elems*=v.getUint64?Number(v.getBigUint64(pos,true)):v.getUint32(pos,true);pos+=8}
  const typ=v.getUint32(pos,true);pos+=4;pos+=8;
  const sz=[0,1,2,2,4,4,4,8,0,0,0,0,0][typ]||4;est+=elems*sz;if(est>1e13)break}}catch(e){}
 return {name:meta['general.name']||file.name,arch:meta['general.architecture']||'?',ver,tensors:Number(nt),estParams:est,meta}}
/* ---------- نظام الصفحات (سجل تلقائي) ---------- */
